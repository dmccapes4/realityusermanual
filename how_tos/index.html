<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HOW_TO INDEX // RUM</title>
<style>
  :root {
    --bg:       #090b0f;
    --bg2:      #0d1117;
    --bg3:      #111820;
    --border:   #1e3a4a;
    --accent:   #00e5ff;
    --accent2:  #00ff9d;
    --dim:      #4a7a8a;
    --text:     #c8e0e8;
    --muted:    #5a8090;
    --score:    #ffd700;
    --star-e:   #2a4a5a;
    --star-f:   #ffd700;
    --danger:   #ff4444;
    --font:     'Courier New', 'Lucida Console', monospace;
    --radius:   2px;
  }
  [data-theme="light"] {
    --bg: #f0f4f8; --bg2: #e0e8f0; --bg3: #d0dce8;
    --border: #90afc0; --accent: #0077aa; --accent2: #007755;
    --dim: #6080a0; --text: #1a2a3a; --muted: #5070a0;
    --score: #a07700; --star-e: #c0d0e0; --star-f: #a07700;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 13px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    padding: 12px 20px;
    display: flex;
    align-items: center;
    gap: 16px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .logo {
    color: var(--accent);
    font-size: 11px;
    letter-spacing: 0.2em;
    white-space: nowrap;
    opacity: 0.8;
    user-select: none;
  }
  .search-wrap {
    position: relative;
    flex: 1;
    max-width: 480px;
  }
  #search {
    width: 100%;
    background: var(--bg3);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--font);
    font-size: 13px;
    padding: 6px 10px 6px 28px;
    outline: none;
    border-radius: var(--radius);
    transition: border-color 0.15s;
  }
  #search:focus { border-color: var(--accent); }
  .search-icon {
    position: absolute;
    left: 8px; top: 50%;
    transform: translateY(-50%);
    color: var(--dim);
    font-size: 12px;
    pointer-events: none;
  }
  #dropdown {
    display: none;
    position: absolute;
    top: calc(100% + 2px);
    left: 0; right: 0;
    background: var(--bg2);
    border: 1px solid var(--accent);
    border-radius: var(--radius);
    z-index: 200;
    overflow: hidden;
  }
  #dropdown.visible { display: block; }
  .dd-item {
    padding: 7px 10px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    border-bottom: 1px solid var(--border);
    transition: background 0.1s;
  }
  .dd-item:last-child { border-bottom: none; }
  .dd-item:hover, .dd-item.active { background: var(--bg3); color: var(--accent); }
  .dd-name { flex: 1; }
  .dd-score { color: var(--score); font-size: 11px; }
  .count-bar {
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    padding: 5px 20px;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.05em;
  }
  .how-to-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px 16px;
  }
  .how-to-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 10px 12px;
    margin-bottom: 4px;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    cursor: pointer;
    transition: border-color 0.1s, background 0.1s;
    position: relative;
  }
  .how-to-row:hover { border-color: var(--accent); background: var(--bg3); }
  .how-to-row.hidden { display: none; }
  .star {
    font-size: 16px;
    color: var(--star-e);
    cursor: pointer;
    flex-shrink: 0;
    margin-top: 2px;
    transition: color 0.15s, transform 0.1s;
    user-select: none;
  }
  .star.filled { color: var(--star-f); }
  .star:hover { transform: scale(1.2); }
  .row-body { flex: 1; min-width: 0; }
  .row-title {
    font-size: 13px;
    color: var(--accent);
    letter-spacing: 0.04em;
    margin-bottom: 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .row-desc {
    font-size: 11px;
    color: var(--text);
    opacity: 0.7;
    line-height: 1.4;
    margin-bottom: 4px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .row-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .theme-tag {
    font-size: 10px;
    color: var(--dim);
    border: 1px solid var(--border);
    border-radius: 1px;
    padding: 1px 5px;
    letter-spacing: 0.05em;
    text-transform: lowercase;
  }
  .score-badge {
    font-size: 11px;
    color: var(--score);
    margin-left: auto;
    flex-shrink: 0;
    font-weight: bold;
    letter-spacing: 0.05em;
  }
  .no-source {
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.05em;
    align-self: flex-start;
    margin-top: 4px;
    flex-shrink: 0;
  }
  footer {
    background: var(--bg2);
    border-top: 1px solid var(--border);
    padding: 6px 20px;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.08em;
    display: flex;
    gap: 20px;
  }
  /* highlight match */
  mark { background: transparent; color: var(--accent2); font-weight: bold; }
</style>
</head>
<body>
<header>
  <div class="logo">▸ REALITY_USER_MANUAL / HOW_TO_INDEX</div>
  <div class="search-wrap">
    <span class="search-icon">⌕</span>
    <input id="search" type="text" placeholder="search how_tos…" autocomplete="off" spellcheck="false">
    <div id="dropdown"></div>
  </div>
  <div style="color:var(--muted);font-size:11px;white-space:nowrap" id="total-count"></div>
</header>
<div class="count-bar" id="status-bar">loading…</div>
<div class="how-to-list" id="list"></div>
<footer>
  <span>PHASE 2 // WEYLAND-YUTANI × GATTACA</span>
  <span id="visited-count" style="margin-left:auto"></span>
</footer>

<script>
const THREL = 'threl.html';

let allHowTos = [];
let visitedSet = new Set(JSON.parse(localStorage.getItem('rum_visited') || '[]'));
let currentQuery = '';
let ddIndex = -1;

function saveVisited() {
  localStorage.setItem('rum_visited', JSON.stringify([...visitedSet]));
  document.getElementById('visited-count').textContent =
    visitedSet.size + ' read / ' + allHowTos.length + ' total';
}

function labelName(name) {
  return name.replace(/^HOW_TO_/, '').toLowerCase().replace(/_/g, ' ');
}

function scoreStr(s) {
  return s !== null ? s.toFixed(0) + '/50' : '—';
}

function highlightMatch(str, q) {
  if (!q) return str;
  const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'gi');
  return str.replace(re, '<mark>$1</mark>');
}

function renderList(items, q) {
  const list = document.getElementById('list');
  list.innerHTML = '';
  items.forEach((ht, idx) => {
    const div = document.createElement('div');
    div.className = 'how-to-row';
    div.dataset.id = ht.id;
    div.dataset.idx = String(idx);

    const isVisited = visitedSet.has(ht.id);
    const label = labelName(ht.name);
    const themes = (ht.themes || []).slice(0, 3);

    div.innerHTML = `
      <span class="star ${isVisited ? 'filled' : ''}" title="${isVisited ? 'mark unread' : 'mark read'}">★</span>
      <div class="row-body">
        <div class="row-title">${highlightMatch(label, q)}</div>
        <div class="row-desc">${highlightMatch(ht.description || '', q)}</div>
        <div class="row-meta">
          ${themes.map(t => `<span class="theme-tag">${t.toLowerCase()}</span>`).join('')}
          <span class="score-badge">${scoreStr(ht.score)}</span>
        </div>
      </div>
      ${!ht.has_source ? '<span class="no-source">[draft]</span>' : ''}
    `;

    div.querySelector('.star').addEventListener('click', e => {
      e.stopPropagation();
      if (visitedSet.has(ht.id)) {
        visitedSet.delete(ht.id);
        e.target.classList.remove('filled');
        e.target.title = 'mark read';
      } else {
        visitedSet.add(ht.id);
        e.target.classList.add('filled');
        e.target.title = 'mark unread';
      }
      saveVisited();
    });

    div.addEventListener('click', () => {
      visitedSet.add(ht.id);
      saveVisited();
      // open threl with this how_to
      window.location.href = `${THREL}?id=${ht.id}`;
    });

    list.appendChild(div);
  });
}

function getMatches(q) {
  if (!q) return allHowTos;
  const ql = q.toLowerCase();
  return allHowTos.filter(ht =>
    labelName(ht.name).includes(ql) ||
    (ht.description || '').toLowerCase().includes(ql) ||
    (ht.themes || []).some(t => t.toLowerCase().includes(ql))
  );
}

function updateDropdown(q) {
  const dd = document.getElementById('dropdown');
  if (!q) { dd.classList.remove('visible'); return; }
  const matches = getMatches(q).slice(0, 5);
  if (!matches.length) { dd.classList.remove('visible'); return; }
  dd.innerHTML = matches.map((ht, i) => `
    <div class="dd-item" data-id="${ht.id}" data-i="${i}">
      <span class="dd-name">${labelName(ht.name)}</span>
      <span class="dd-score">${scoreStr(ht.score)}</span>
    </div>
  `).join('');
  dd.querySelectorAll('.dd-item').forEach(el => {
    el.addEventListener('mousedown', e => {
      e.preventDefault();
      window.location.href = `${THREL}?id=${el.dataset.id}`;
    });
  });
  dd.classList.add('visible');
  ddIndex = -1;
}

function updateStatusBar(items, q) {
  const bar = document.getElementById('status-bar');
  if (!q) {
    bar.textContent = `${allHowTos.length} documents // roll order d${allHowTos.length}`;
  } else {
    bar.textContent = `${items.length} match${items.length !== 1 ? 'es' : ''} for "${q}"`;
  }
}

const searchEl = document.getElementById('search');
searchEl.addEventListener('input', () => {
  currentQuery = searchEl.value.trim();
  const matches = getMatches(currentQuery);
  renderList(matches, currentQuery);
  updateDropdown(currentQuery);
  updateStatusBar(matches, currentQuery);
});

searchEl.addEventListener('keydown', e => {
  const dd = document.getElementById('dropdown');
  const items = dd.querySelectorAll('.dd-item');
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    ddIndex = Math.min(ddIndex + 1, items.length - 1);
    items.forEach((el, i) => el.classList.toggle('active', i === ddIndex));
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    ddIndex = Math.max(ddIndex - 1, -1);
    items.forEach((el, i) => el.classList.toggle('active', i === ddIndex));
  } else if (e.key === 'Enter') {
    if (ddIndex >= 0 && items[ddIndex]) {
      window.location.href = `${THREL}?id=${items[ddIndex].dataset.id}`;
    } else if (currentQuery) {
      const m = getMatches(currentQuery);
      if (m.length) window.location.href = `${THREL}?id=${m[0].id}`;
    }
  } else if (e.key === 'Escape') {
    searchEl.value = '';
    currentQuery = '';
    dd.classList.remove('visible');
    renderList(allHowTos, '');
    updateStatusBar(allHowTos, '');
  }
});

document.addEventListener('click', e => {
  if (!e.target.closest('.search-wrap'))
    document.getElementById('dropdown').classList.remove('visible');
});

// handle ?q= param
const urlQ = new URLSearchParams(location.search).get('q') || '';

fetch('data.json')
  .then(r => r.json())
  .then(data => {
    allHowTos = data.how_tos;
    document.getElementById('total-count').textContent = allHowTos.length + ' docs';
    if (urlQ) {
      searchEl.value = urlQ;
      currentQuery = urlQ;
      const m = getMatches(urlQ);
      renderList(m, urlQ);
      updateStatusBar(m, urlQ);
    } else {
      renderList(allHowTos, '');
      updateStatusBar(allHowTos, '');
    }
    saveVisited();
  });
</script>
</body>
</html>
