<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THREL // RUM HOW_TO</title>
<style>
  :root {
    --bg:      #090b0f;
    --bg2:     #0d1117;
    --bg3:     #111820;
    --border:  #1e3a4a;
    --accent:  #00e5ff;
    --accent2: #00ff9d;
    --dim:     #4a7a8a;
    --text:    #c8e0e8;
    --muted:   #5a8090;
    --score:   #ffd700;
    --active-tab: #00e5ff;
    --font:    'Courier New', 'Lucida Console', monospace;
    --radius:  2px;
  }
  [data-theme="light"] {
    --bg: #f0f4f8; --bg2: #e0e8f0; --bg3: #d0dce8;
    --border: #90afc0; --accent: #0066cc; --accent2: #007755;
    --dim: #6080a0; --text: #1a2a3a; --muted: #5070a0;
    --score: #806000; --active-tab: #0066cc;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 13px;
    display: flex;
    flex-direction: column;
  }

  /* ── TOP BAR ── */
  #topbar {
    display: flex;
    align-items: center;
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    padding: 0 8px;
    height: 38px;
    gap: 4px;
    position: sticky;
    top: 0;
    z-index: 100;
    flex-shrink: 0;
  }
  .tb-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--dim);
    font-family: var(--font);
    font-size: 11px;
    padding: 3px 8px;
    cursor: pointer;
    border-radius: var(--radius);
    letter-spacing: 0.06em;
    transition: border-color 0.1s, color 0.1s;
    white-space: nowrap;
  }
  .tb-btn:hover { border-color: var(--accent); color: var(--accent); }
  .tb-btn.nav { padding: 3px 6px; font-size: 14px; line-height: 1; }
  .tb-spacer { flex: 1; }
  .tab-group {
    display: flex;
    gap: 2px;
  }
  .tab {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: var(--font);
    font-size: 11px;
    padding: 4px 14px;
    cursor: pointer;
    letter-spacing: 0.08em;
    border-radius: var(--radius);
    transition: all 0.1s;
  }
  .tab.active {
    border-color: var(--active-tab);
    color: var(--active-tab);
    background: rgba(0,229,255,0.06);
  }
  #how-to-label {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.08em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 220px;
    padding: 0 8px;
  }

  /* ── CONTENT AREA ── */
  #content-area {
    flex: 1;
    overflow-y: auto;
    padding: 24px 32px;
    line-height: 1.65;
  }
  /* markdown-rendered prose */
  #content-area h1 { font-size: 18px; color: var(--accent); border-bottom: 1px solid var(--border); padding-bottom: 6px; margin-bottom: 16px; letter-spacing: 0.04em; }
  #content-area h2 { font-size: 15px; color: var(--accent2); margin: 20px 0 8px; letter-spacing: 0.03em; }
  #content-area h3 { font-size: 13px; color: var(--dim); margin: 14px 0 6px; }
  #content-area p { margin-bottom: 10px; color: var(--text); opacity: 0.9; }
  #content-area ul, #content-area ol { margin: 8px 0 10px 20px; }
  #content-area li { margin-bottom: 4px; }
  #content-area code { background: var(--bg3); color: var(--accent2); padding: 1px 5px; border-radius: 1px; font-size: 12px; }
  #content-area pre { background: var(--bg3); border: 1px solid var(--border); padding: 12px; overflow-x: auto; margin: 10px 0; border-radius: var(--radius); }
  #content-area pre code { background: none; padding: 0; }
  #content-area blockquote { border-left: 2px solid var(--accent); padding-left: 12px; color: var(--muted); margin: 10px 0; }
  #content-area table { border-collapse: collapse; width: 100%; margin: 10px 0; }
  #content-area th { border: 1px solid var(--border); padding: 6px 10px; background: var(--bg3); color: var(--accent); font-size: 11px; letter-spacing: 0.06em; text-align: left; }
  #content-area td { border: 1px solid var(--border); padding: 5px 10px; color: var(--text); font-size: 12px; }
  #content-area hr { border: none; border-top: 1px solid var(--border); margin: 16px 0; }
  #content-area a { color: var(--accent2); text-decoration: none; }
  #content-area a:hover { text-decoration: underline; }
  #content-area strong { color: var(--text); }
  #content-area em { color: var(--dim); font-style: italic; }

  /* ── BOTTOM BAR ── */
  #bottombar {
    display: flex;
    align-items: center;
    background: var(--bg2);
    border-top: 1px solid var(--border);
    padding: 6px 12px;
    height: 36px;
    gap: 8px;
    flex-shrink: 0;
  }
  .bb-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--dim);
    font-family: var(--font);
    font-size: 14px;
    padding: 3px 10px;
    cursor: pointer;
    border-radius: var(--radius);
    transition: border-color 0.1s, color 0.1s;
    line-height: 1;
  }
  .bb-btn:hover { border-color: var(--accent); color: var(--accent); }
  .bb-btn.active { border-color: var(--accent2); color: var(--accent2); }
  .bb-spacer { flex: 1; }
  #score-display {
    font-size: 11px;
    color: var(--score);
    letter-spacing: 0.06em;
  }
  #loading-msg {
    color: var(--muted);
    font-size: 12px;
    letter-spacing: 0.08em;
    padding: 40px;
  }
</style>
</head>
<body data-theme="dark">

<div id="topbar">
  <!-- left: [?] random, [<] prev -->
  <button class="tb-btn" id="btn-random" title="random how_to">?</button>
  <button class="tb-btn nav" id="btn-prev" title="previous">‹</button>
  <!-- label -->
  <span id="how-to-label">…</span>
  <div class="tb-spacer"></div>
  <!-- center: tabs -->
  <div class="tab-group">
    <button class="tab active" id="tab-report" onclick="switchTab('report')">report</button>
    <button class="tab" id="tab-content" onclick="switchTab('content')">content</button>
  </div>
  <div class="tb-spacer"></div>
  <!-- right: [>] next, [X] close -->
  <button class="tb-btn nav" id="btn-next" title="next">›</button>
  <button class="tb-btn" id="btn-close" title="close">×</button>
</div>

<div id="content-area"><div id="loading-msg">LOADING…</div></div>

<div id="bottombar">
  <button class="bb-btn" id="btn-eye" title="toggle light/dark">👁</button>
  <span id="score-display"></span>
  <div class="bb-spacer"></div>
  <button class="bb-btn" id="btn-audio" title="narrate">♪</button>
</div>

<script>
// ── state ──
let data = null;
let allHowTos = [];
let currentId = null;
let currentTab = 'report'; // open to report by default
let audioPlaying = false;
let audioEl = null;

const INDEX = 'index.html';

// ── init ──
const params = new URLSearchParams(location.search);
const reqId = params.get('id');

fetch('data.json').then(r => r.json()).then(d => {
  data = d;
  allHowTos = d.how_tos;
  const ht = reqId ? allHowTos.find(h => h.id === reqId) : allHowTos[0];
  if (ht) loadHowTo(ht.id);
  else document.getElementById('loading-msg').textContent = 'NOT FOUND';
});

function idxOf(id) { return allHowTos.findIndex(h => h.id === id); }

function loadHowTo(id) {
  currentId = id;
  const ht = allHowTos.find(h => h.id === id);
  if (!ht) return;

  document.title = labelName(ht.name) + ' // RUM';
  document.getElementById('how-to-label').textContent = labelName(ht.name);
  document.getElementById('score-display').textContent = ht.score ? ht.score + '/50' : '';

  // update URL without reload
  history.replaceState(null, '', `?id=${id}`);

  // track visited
  const visited = new Set(JSON.parse(localStorage.getItem('rum_visited') || '[]'));
  visited.add(id);
  localStorage.setItem('rum_visited', JSON.stringify([...visited]));

  loadTab(currentTab, ht);
  stopAudio();
}

function labelName(name) {
  return name.replace(/^HOW_TO_/, '').toLowerCase().replace(/_/g, ' ');
}

function switchTab(tab) {
  currentTab = tab;
  document.getElementById('tab-report').classList.toggle('active', tab === 'report');
  document.getElementById('tab-content').classList.toggle('active', tab === 'content');
  const ht = allHowTos.find(h => h.id === currentId);
  if (ht) loadTab(tab, ht);
  stopAudio();
}

function loadTab(tab, ht) {
  const area = document.getElementById('content-area');
  area.innerHTML = '<div id="loading-msg">LOADING…</div>';
  const file = tab === 'report' ? ht.folder + '/report.md' : ht.folder + '/source.md';
  // fetch relative to RUM root — threl.html is in how_tos/, folder is how_tos/slug/
  const relPath = file.replace('how_tos/', '');
  fetch(relPath)
    .then(r => r.ok ? r.text() : Promise.reject(r.status))
    .then(md => { area.innerHTML = renderMD(md); })
    .catch(e => { area.innerHTML = `<p style="color:var(--muted)">could not load: ${relPath} (${e})</p>`; });
}

// ── minimal markdown renderer ──
function renderMD(md) {
  let html = md
    // escape HTML
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    // headings
    .replace(/^#### (.+)$/gm,'<h4>$1</h4>')
    .replace(/^### (.+)$/gm,'<h3>$1</h3>')
    .replace(/^## (.+)$/gm,'<h2>$1</h2>')
    .replace(/^# (.+)$/gm,'<h1>$1</h1>')
    // hr
    .replace(/^---+$/gm,'<hr>')
    // bold / italic
    .replace(/\*\*\*(.+?)\*\*\*/g,'<strong><em>$1</em></strong>')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*(.+?)\*/g,'<em>$1</em>')
    // inline code
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    // blockquote
    .replace(/^&gt; (.+)$/gm,'<blockquote>$1</blockquote>')
    // unordered list items
    .replace(/^[-*] (.+)$/gm,'<li>$1</li>')
    // ordered list items
    .replace(/^\d+\. (.+)$/gm,'<li>$1</li>')
    // tables (simple)
    .replace(/^\|(.+)\|$/gm, (row) => {
      const cells = row.slice(1,-1).split('|').map(c=>c.trim());
      if (cells.every(c => /^[-:]+$/.test(c))) return '';
      return '<tr>' + cells.map(c=>`<td>${c}</td>`).join('') + '</tr>';
    });

  // wrap <li> runs in <ul>
  html = html.replace(/(<li>.*<\/li>(\n|$))+/g, m => '<ul>' + m + '</ul>');
  // wrap <tr> runs in <table>
  html = html.replace(/(<tr>.*<\/tr>(\n|$))+/g, m => '<table>' + m + '</table>');

  // paragraphs: lines not already tagged
  html = html.split('\n').map(line => {
    if (!line.trim()) return '';
    if (/^<(h[1-6]|ul|ol|li|table|tr|td|th|hr|blockquote|pre|div)/.test(line)) return line;
    return '<p>' + line + '</p>';
  }).join('\n');

  return html;
}

// ── navigation ──
document.getElementById('btn-prev').addEventListener('click', () => {
  const i = idxOf(currentId);
  if (i > 0) loadHowTo(allHowTos[i-1].id);
});
document.getElementById('btn-next').addEventListener('click', () => {
  const i = idxOf(currentId);
  if (i < allHowTos.length-1) loadHowTo(allHowTos[i+1].id);
});
document.getElementById('btn-random').addEventListener('click', () => {
  const candidates = allHowTos.filter(h => h.id !== currentId);
  const pick = candidates[Math.floor(Math.random() * candidates.length)];
  if (pick) loadHowTo(pick.id);
});
document.getElementById('btn-close').addEventListener('click', () => {
  window.location.href = INDEX;
});

// ── light/dark ──
document.getElementById('btn-eye').addEventListener('click', () => {
  const body = document.body;
  const cur = body.dataset.theme;
  body.dataset.theme = cur === 'light' ? 'dark' : 'light';
  localStorage.setItem('rum_theme', body.dataset.theme);
});
// restore theme
const savedTheme = localStorage.getItem('rum_theme');
if (savedTheme) document.body.dataset.theme = savedTheme;

// ── audio (ElevenLabs Matilda) ──
// Audio generation requires server-side API call.
// When the button is clicked, fetches audio/slug.mp3 if it exists,
// or shows a status message about generation needed.
document.getElementById('btn-audio').addEventListener('click', () => {
  const ht = allHowTos.find(h => h.id === currentId);
  if (!ht) return;
  const btn = document.getElementById('btn-audio');

  if (audioPlaying) {
    stopAudio();
    return;
  }

  const audioPath = ht.folder.replace('how_tos/', '') + '/audio.mp3';
  if (!audioEl) audioEl = new Audio();
  audioEl.src = audioPath;
  audioEl.onended = () => { audioPlaying = false; btn.classList.remove('active'); };
  audioEl.onerror = () => {
    audioPlaying = false;
    btn.classList.remove('active');
    // show generation note in bottom bar
    const note = document.createElement('span');
    note.style.cssText = 'color:var(--muted);font-size:10px;letter-spacing:0.06em;';
    note.textContent = ' ▸ audio not yet generated — run tools/gen_how_to_audio.py';
    document.getElementById('bottombar').appendChild(note);
    setTimeout(() => note.remove(), 4000);
  };
  audioEl.play();
  audioPlaying = true;
  btn.classList.add('active');
});

function stopAudio() {
  if (audioEl) { audioEl.pause(); audioEl.currentTime = 0; }
  audioPlaying = false;
  document.getElementById('btn-audio').classList.remove('active');
}
</script>
</body>
</html>
