server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name realityusermanual.dylanmccapes.systems;

    ssl_certificate     /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;

    root /var/www/realityusermanual;
    index index.html;

    location ~* \.pdf$ {
        add_header Content-Type application/pdf;
        add_header Content-Disposition inline;
        add_header Cache-Control "public, max-age=300";
    }

    location /listen/media/ {
        sendfile on;
        tcp_nopush on;
        gzip off;
        add_header Accept-Ranges bytes;
        add_header Cache-Control "public, max-age=86400";
    }

    # Hall help-for-help audio: never SPA-fallback to index.html (CF caches that as the .mp3).
    location /hall/help_for_help/ {
        sendfile on;
        tcp_nopush on;
        gzip off;
        add_header Accept-Ranges bytes;
        add_header Cache-Control "public, max-age=3600";
        types {
            audio/mpeg mp3;
            text/markdown md;
            text/plain txt;
        }
        default_type application/octet-stream;
        try_files $uri =404;
    }

    location /whichwitch/ {
        sendfile on;
        tcp_nopush on;
        gzip off;
        add_header Accept-Ranges bytes;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri $uri/ /whichwitch/index.html;
    }

    location /listen/t/ {
        types {
            text/vtt vtt;
            text/plain txt;
            application/json json;
        }
        default_type text/plain;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location / {
        add_header Cache-Control "public, max-age=60";
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name realityusermanual.dylanmccapes.systems;
    return 301 https://$host$request_uri;
}
