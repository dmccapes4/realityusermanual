<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Station — sequence</title>
<link rel="stylesheet" href="/desk.css">
</head>
<body>
<header>
  <div>
    <a href="/">Station directory</a>
    <h1 id="desk-title">Sequence</h1>
  </div>
  <div class="stamp" id="desk-stamp">intake</div>
</header>
<div class="desk">
  <nav id="file-tree"></nav>
  <main>
    <div id="viewer-label">Sequence opens in the pane. Scroll is native.</div>
    <div id="viewer">
      <div class="empty" id="empty">Loading intake…</div>
      <object id="pdf-viewer" type="application/pdf" data="">
        <p>This browser will not embed the sequence. Take it from the tree.</p>
      </object>
      <div id="image-wrap"><img id="image-viewer" alt=""></div>
      <pre id="text-view"></pre>
    </div>
  </main>
</div>
<script src="/desk.js"></script>
</body>
</html>
